name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # This is a public server URL, not a secret. Provider keys remain in Azure.
          VITE_WICK_API_BASE_URL: ${{ vars.VITE_WICK_API_BASE_URL }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/node/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: functions/node

      - name: Check backend
        run: npm run check
        working-directory: functions/node

      - name: Deploy Node Function App
        uses: Azure/functions-action@v1
        with:
          app-name: wick-node-c5167eed
          package: functions/node
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          remote-build: true

      - name: Verify backend health
        run: |
          curl --fail --silent --show-error \
            https://wick-node-c5167eed.azurewebsites.net/api/health
