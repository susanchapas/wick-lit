<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Wick: practise stepping in. Role-play real situations and get private coaching on the five Ds." />
    <meta name="theme-color" content="#020a06" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Wick</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("wick.settings") || "{}");
        var m = function (q) { return matchMedia(q).matches; };
        var r = document.documentElement;
        r.dataset.theme = s.theme || (m("(prefers-contrast: more)") ? "contrast" : m("(prefers-color-scheme: light)") ? "dawn" : "night");
        if (s.reduceMotion) r.dataset.motion = "still";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
